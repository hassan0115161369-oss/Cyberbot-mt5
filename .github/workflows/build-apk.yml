name: Build CyberBot MT5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Prepare virtual environment with pip and flet
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python pip "flet[all]==0.25.0" metaapi-cloud-sdk

      - name: Build Android APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          build-command: apk
          project-dir: .
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CyberBot-MT5-APK
          path: build/apk/*.apk
