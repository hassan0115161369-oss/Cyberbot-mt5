name: Build CyberBot MT5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CyberBot-MT5-APK
          path: build/apk/*.apk
