[project]
name = "cyberbot-mt5"
version = "4.0.0"
description = "CYBERBOT MT5 PRO v4.0 ULTIMATE AI - Powered by TickerAll"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet",
    "httpx",
]

[dependency-groups]
dev = [
    "flet-cli",
]

[tool.flet]
org = "com.cyberbot.mt5"
product = "CyberBot MT5 Pro"

[tool.flet.app]
path = "."

[tool.flet.android]
target_arch = ["arm64-v8a", "armeabi-v7a", "x86_64"]
