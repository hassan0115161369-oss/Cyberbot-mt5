[project]
name = "cyberbot-mt5"
version = "1.0.0"
description = "CyberBot MT5 - AI Trading Bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet",
    "metaapi-cloud-sdk",
]

[dependency-groups]
dev = [
    "flet-cli",
]

[tool.flet]
org = "com.cyberbot.mt5"
product = "CyberBot MT5"

[tool.flet.app]
path = "."

[tool.flet.android]
extract_packages = ["metaapi_cloud_sdk"]
target_arch = ["arm64-v8a", "armeabi-v7a", "x86_64"]
